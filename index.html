<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharmacolibrary simulators</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="assets/w3.css">
  <link rel="stylesheet" href="assets/buble.css">
  <style>
    /* Sidebar legibility: in the generated ATC tree a drug WITH a rendered page is a
       link and one without is plain list text. The buble theme gives .sidebar ul li a
       no colour of its own, so both inherited the body grey and looked identical.
       Link = the same theme blue the index uses; no page = muted. */
    .sidebar ul li a { color: var(--theme-color, #0074d9); }
    .sidebar ul li a:hover { text-decoration: underline; }
    .sidebar ul li { color: #8a9199; }
    /* the theme's own .sidebar li.active a (0,2,2) outranks the rule above (0,1,3),
       so the CURRENT page's entry needs a selector that beats it, or it reverts to grey */
    .sidebar ul li.active a,
    .sidebar ul li a.active { color: var(--theme-color, #0074d9); font-weight: 600; }
    /* Collapsed column legends under the Parameters / Validation tables on a record page.
       Built as raw HTML by docs/build.py because docsify does not re-enter markdown inside
       an HTML block. */
    .markdown-section details.legend { margin: -6px 0 22px; font-size: 14px; }
    .markdown-section details.legend > summary {
      cursor: pointer; color: var(--theme-color, #0074d9); font-size: 13px;
      padding: 4px 0; width: fit-content;
    }
    .markdown-section details.legend[open] > summary { margin-bottom: 8px; }
    .markdown-section details.legend table { margin: 0; font-size: 13px; }
    .markdown-section details.legend td:first-child { white-space: nowrap; vertical-align: top; }
    .markdown-section details.legend td:last-child { color: #4b5563; }
    .markdown-section details.legend th { text-align: left; }
    /* ── record tabs ──────────────────────────────────────────────────────────
       build.py emits <div class="pk-tab-mark" data-tab="..."> sentinels and closes with
       .pk-tab-end; the plugin below slices the rendered section at those points. The split
       happens in the DOM because docsify does not re-enter markdown inside an HTML block —
       wrapping the panels in the markdown would print the first tab as literal text. */
    /* ── database-backed sidebar search ───────────────────────────────────────
       Replaces the docsify search plugin, which could not index this corpus. */
    .pks { padding: 0 0 10px; border-bottom: 1px solid #eaecef; margin-bottom: 10px; }
    .pks input { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px;
      padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .pks-hint { font-size: 11.5px; color: #94a3b8; padding: 4px 2px 0; }
    .pks-res { list-style: none; margin: 6px 0 0; padding: 0; max-height: 46vh; overflow-y: auto; }
    .pks-res li { padding: 0; margin: 0; }
    .pks-res a { display: block; padding: 5px 7px; border-radius: 5px; font-size: 13px;
      color: #334155; text-decoration: none; }
    .pks-res a:hover { background: #f1f5f9; color: var(--theme-color, #0074d9); }
    .pks-res .k { display: inline-block; min-width: 62px; font-size: 10.5px;
      text-transform: uppercase; letter-spacing: .04em; color: #94a3b8; }
    .pks-res .d { color: #94a3b8; font-size: 11.5px; }
    /* ── query page ───────────────────────────────────────────────────────────
       Only the /query route uses these; the engine itself (sql.js, 688 kB) is
       fetched by the plugin below and never on any other page. */
    .pkq-status { padding: 10px 12px; border-radius: 6px; background: #f1f5f9;
      color: #475569; font-size: 14px; margin: 12px 0; }
    .pkq-status.err { background: #fef2f2; color: #b91c1c; }
    .pkq-canned { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .pkq-btn { font: inherit; font-size: 13px; padding: 5px 10px; cursor: pointer;
      border: 1px solid #cbd5e1; border-radius: 999px; background: #fff; color: #334155; }
    .pkq-btn:hover { border-color: var(--theme-color, #0074d9); color: var(--theme-color, #0074d9); }
    .pkq-btn.pkq-run { border-radius: 6px; background: var(--theme-color, #0074d9);
      color: #fff; border-color: transparent; padding: 6px 16px; }
    .pkq-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0; }
    .pkq-row label { font-size: 13px; color: #64748b; }
    .pkq-row input { font: inherit; font-size: 13px; padding: 5px 8px; min-width: 190px;
      border: 1px solid #cbd5e1; border-radius: 6px; }
    #pkq-sql { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;
      background: #f8fafc; color: #0f172a; }
    .pkq-meta { font-size: 12.5px; color: #64748b; }
    #pkq-out { overflow-x: auto; }
    #pkq-out table { font-size: 13px; border-collapse: collapse; margin-top: 10px; }
    #pkq-out th { text-align: left; background: #f1f5f9; position: sticky; top: 0; }
    #pkq-out th, #pkq-out td { padding: 4px 10px; border-bottom: 1px solid #e2e8f0;
      white-space: nowrap; }
    #pkq-out td.num { text-align: right; font-variant-numeric: tabular-nums; }
    /* ── breadcrumbs ──────────────────────────────────────────────────────────
       build.py stamps <div class="pk-crumbs" data-crumbs="[…]"> with labels it already
       knows (generic name, ATC class, paper stem). A plugin that only split the URL could
       show drug_abacavir but not abacavir, which is why the trail is authored, not parsed. */
    .pk-crumbs { display: none; }
    .markdown-section nav.pk-crumbtrail {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      margin: -8px 0 18px; font-size: 13px; color: #64748b;
    }
    .markdown-section nav.pk-crumbtrail a { color: #64748b; text-decoration: none; }
    .markdown-section nav.pk-crumbtrail a:hover { color: var(--theme-color, #0074d9);
      text-decoration: underline; }
    .markdown-section nav.pk-crumbtrail .sep { color: #cbd5e1; }
    .markdown-section nav.pk-crumbtrail .here { color: #334155; font-weight: 600; }
    /* ── floating record panel ────────────────────────────────────────────────
       build.py stamps <div class="pk-recnav" data-items="[…]"> on every page of a drug:
       the drug's popPK records, one link + status badge each, the same list as the drug
       page's records table. The plugin below renders it as a fixed box top-right, so a
       reader can hop between a drug's models without returning to the drug page. */
    .pk-recnav { display: none; }
    aside.pk-recpanel {
      position: fixed; top: 64px; right: 18px; z-index: 30;
      max-width: 300px; max-height: calc(100vh - 90px); overflow: auto;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 8px;
      box-shadow: 0 6px 22px rgba(15, 23, 42, .10);
      font-size: 12px; line-height: 1.35;
    }
    aside.pk-recpanel > button.hd {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 6px 10px; border: 0; background: #f8fafc; cursor: pointer;
      font: inherit; font-weight: 600; color: #334155; text-align: left;
      border-bottom: 1px solid #e2e8f0; border-radius: 8px 8px 0 0;
    }
    aside.pk-recpanel > button.hd .n { color: #94a3b8; font-weight: 400; }
    aside.pk-recpanel > button.hd .tg { margin-left: auto; color: #94a3b8; }
    aside.pk-recpanel.closed > ul { display: none; }
    aside.pk-recpanel.closed > button.hd { border-bottom: 0; border-radius: 8px; }
    aside.pk-recpanel > ul { list-style: none; margin: 0; padding: 4px 0; }
    aside.pk-recpanel > ul > li { display: flex; align-items: center; gap: 8px;
      padding: 3px 10px; white-space: nowrap; }
    aside.pk-recpanel > ul > li.here { background: #eef6ff; }
    aside.pk-recpanel a { color: #334155; text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
      overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    aside.pk-recpanel a:hover { color: var(--theme-color, #0074d9); text-decoration: underline; }
    aside.pk-recpanel li.here a { font-weight: 700; }
    aside.pk-recpanel .pk-badge { font-size: 9px; padding: 1px 6px; flex: 0 0 auto; }
    @media (max-width: 1100px) { aside.pk-recpanel { display: none; } }
    /* The search box the official plugin injects at the top of the sidebar. */
    .sidebar .search { margin-bottom: 12px; border-bottom: 1px solid #eaecef; }
    .sidebar .search input { font-size: 14px; padding: 7px 8px; }
    .sidebar .search .results-panel { font-size: 13px; }
    .pk-tab-mark, .pk-tab-end { display: none; }
    .markdown-section .pk-tabbar {
      display: flex; gap: 4px; border-bottom: 1px solid #e3e7eb;
      margin: 4px 0 16px; padding: 0;
    }
    .markdown-section .pk-tabbar button {
      appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
      margin-bottom: -1px; padding: 9px 16px; cursor: pointer;
      font: inherit; font-size: 15px; color: #6b7280;
    }
    .markdown-section .pk-tabbar button:hover { color: var(--theme-color, #0074d9); }
    .markdown-section .pk-tabbar button[aria-selected="true"] {
      color: var(--theme-color, #0074d9); font-weight: 600;
      border-bottom-color: var(--theme-color, #0074d9);
    }
    .markdown-section .pk-tabpanel[hidden] { display: none; }
    /* first heading in a panel: the tab bar already provides the separation. The record
       title lives inside the Information panel (the tab bar is the first thing on the page),
       so the h1 loses its top margin too. */
    .markdown-section .pk-tabpanel > h1:first-child,
    .markdown-section .pk-tabpanel > h2:first-child { margin-top: 0; }
    /* Models tab: the bundle table beside a bounded diagram; the diagram wraps under the
       table when the panel is too narrow for both (flex-wrap, table first in the DOM). */
    .markdown-section .pk-models-grid { display: flex; flex-wrap: wrap; gap: 8px 24px;
      align-items: flex-start; }
    .markdown-section .pk-models-grid .pk-models-table { flex: 1 1 460px; min-width: 0; }
    .markdown-section .pk-models-grid .pk-models-table > p { font-size: 13px; color: #4b5563; }
    .markdown-section .pk-models-grid figure.pk-models-diagram { flex: 0 1 380px;
      max-width: 380px; margin: 0; }
    .markdown-section .pk-models-grid figure.pk-models-diagram img { display: block;
      width: 100%; height: auto; max-height: 420px; object-fit: contain;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; }
    .markdown-section .pk-models-grid figure.pk-models-diagram figcaption {
      font-size: 12px; color: #6b7280; margin-top: 6px; }
    /* Simulation tab: the element is the first thing in the panel */
    .markdown-section .pk-tabpanel > dbs-fmusim:first-child { display: block; margin-top: 0; }
    .markdown-section table.pk-models { width: 100%; }
    .markdown-section table.pk-models td:first-child { white-space: nowrap; }
    .markdown-section .pk-missing { color: #9aa1a9; font-style: italic; }
    .markdown-section .pk-size { color: #6b7280; font-size: 13px; }
    /* collapsed sidebar sections */
    .sidebar details.pk-navgroup > summary { list-style: none; cursor: pointer; }
    .sidebar details.pk-navgroup > summary::-webkit-details-marker { display: none; }
    .sidebar details.pk-navgroup > summary h4 { display: inline-block; margin: 0; }
    .sidebar details.pk-navgroup > summary::before {
      content: "▸"; display: inline-block; width: 1em; color: #8a9199;
      transition: transform .12s ease;
    }
    .sidebar details.pk-navgroup[open] > summary::before { transform: rotate(90deg); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      loadSidebar: true,
      // loadNavbar stays OFF: no _navbar.md is generated anywhere in this repo, and asking
      // for one 404s on every page load.
      loadNavbar: false,
      // ONE sidebar for the whole site. loadSidebar fetches _sidebar.md relative to the page
      // being viewed, so opening drugs/drug_x/ or atc/A01A.md would look for a sidebar THERE
      // and, finding one, replace the navigation the reader was using. Alias every such
      // request back to the root file; the per-directory ones are no longer generated.
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      name: '',
      repo: ''
    }
  </script>
  <script>
    // Record tabs. Slices .markdown-section at the sentinels build.py emits: content before
    // the first mark is the page header and is left alone, each mark opens a panel, and
    // .pk-tab-end returns the remainder (the footer) to the page. Runs on doneEach, after
    // docsify has rendered the markdown, so panel content is real markdown output.
    window.$docsify = window.$docsify || {};
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      hook.doneEach(function () {
        var section = document.querySelector('.markdown-section');
        if (!section || !section.querySelector('.pk-tab-mark')) return;

        var nodes = Array.prototype.slice.call(section.childNodes);
        var panels = [], current = null, anchor = null, done = false;

        nodes.forEach(function (node) {
          if (done) return;
          var el = node.nodeType === 1 ? node : null;
          if (el && el.classList.contains('pk-tab-mark')) {
            current = {title: el.dataset.tab || 'Tab', nodes: []};
            panels.push(current);
            if (!anchor) anchor = el;          // where the tab bar goes
            return;
          }
          if (el && el.classList.contains('pk-tab-end')) { done = true; return; }
          if (current) current.nodes.push(node);
        });
        if (!panels.length) return;

        // One container at the position of the first mark, holding the bar and every panel.
        // Anything after .pk-tab-end (the footer) stays a sibling of the container, so it keeps
        // its place on the page instead of being dragged into the last tab.
        var wrap = document.createElement('div');
        wrap.className = 'pk-tabs';
        anchor.parentNode.insertBefore(wrap, anchor);

        var bar = document.createElement('div');
        bar.className = 'pk-tabbar';
        bar.setAttribute('role', 'tablist');
        wrap.appendChild(bar);

        var built = panels.map(function (p, i) {
          var panel = document.createElement('div');
          panel.className = 'pk-tabpanel';
          panel.setAttribute('role', 'tabpanel');
          p.nodes.forEach(function (n) { panel.appendChild(n); });   // moves, not clones
          wrap.appendChild(panel);

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = p.title;
          btn.setAttribute('role', 'tab');
          bar.appendChild(btn);
          return {btn: btn, panel: panel, i: i};
        });

        // the sentinels have served their purpose and are not content
        Array.prototype.slice.call(section.querySelectorAll('.pk-tab-mark, .pk-tab-end'))
          .forEach(function (el) { el.parentNode.removeChild(el); });

        function select(i) {
          built.forEach(function (b) {
            b.btn.setAttribute('aria-selected', b.i === i ? 'true' : 'false');
            b.panel.hidden = b.i !== i;
          });
          try { sessionStorage.setItem('pk-tab', built[i].btn.textContent); } catch (e) {}
        }
        built.forEach(function (b) { b.btn.addEventListener('click', function () { select(b.i); }); });

        // Reopen the tab the reader was last on, so paging through records does not send
        // them back to Information every time. Falls back to the first tab.
        var want = 0;
        try {
          var saved = sessionStorage.getItem('pk-tab');
          built.forEach(function (b) { if (b.btn.textContent === saved) want = b.i; });
        } catch (e) {}
        select(want);
      });
    });
  </script>
  <script>
    // Collapse the sidebar's curated-panel sections. Wrapping them in <details> in the
    // markdown is not an option: docsify does not re-enter markdown inside an HTML block, so
    // every drug link inside would render as literal text. Instead the section headings are
    // found in the DOM after render and each heading + its list is moved into a <details>.
    //
    // The ATC tree is left alone — it is the part people browse, and its own nesting already
    // keeps it short.
    window.$docsify = window.$docsify || {};
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      var COLLAPSE = ['ddd', 'dbs', 'dph', 'dse', 'toxins'];
      hook.doneEach(function () {
        var nav = document.querySelector('.sidebar-nav') || document.querySelector('.sidebar');
        if (!nav) return;
        nav.querySelectorAll('h4').forEach(function (h) {
          var name = (h.textContent || '').trim().split(/\s+/)[0].toLowerCase();
          if (COLLAPSE.indexOf(name) < 0) return;
          if (h.parentNode && h.parentNode.tagName === 'SUMMARY') return;   // already done
          var list = h.nextElementSibling;
          if (!list || list.tagName !== 'UL') return;
          var d = document.createElement('details');
          d.className = 'pk-navgroup';
          var sm = document.createElement('summary');
          h.parentNode.insertBefore(d, h);
          sm.appendChild(h);
          d.appendChild(sm);
          d.appendChild(list);
          // Keep the section open when the page being viewed is inside it, so the reader is
          // never looking at a page whose own entry is hidden.
          if (list.querySelector('a.active, li.active')) d.open = true;
        });
      });
    });



    // ── sidebar search, over the database ──────────────────────────────────────
    // docsify's plugin indexed rendered pages into localStorage and blew its quota. This
    // searches 5420 ENTITIES — drugs, paper titles, genes, parameter names and the ontology's
    // synonyms — from the same file the query page uses. The database loads on the first
    // keystroke, never on page load, so no page pays for a search nobody performed.
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      var box, res, hint, timer;

      function go(term) {
        term = (term || '').trim();
        if (!res) return;
        if (term.length < 2) { res.innerHTML = ''; return; }
        var db = window.pkdb.get();
        if (!db) {
          hint.textContent = 'loading the index…';
          window.pkdb.load(function (m) { hint.textContent = m; })
            .then(function () { hint.textContent = ''; go(box.value); })
            .catch(function (e) { hint.textContent = String(e.message || e); });
          return;
        }
        var like = '%' + term.replace(/'/g, "''") + '%';
        var rows;
        try {
          // Exact prefix first, then contains — so typing "clop" puts the drug above the
          // thirty papers whose titles mention it.
          rows = db.exec(
            "SELECT kind, label, detail, href FROM search_doc WHERE label LIKE '" + like + "' " +
            "ORDER BY (CASE WHEN lower(label) = lower('" + term.replace(/'/g, "''") + "') THEN 0 " +
            "          WHEN lower(label) LIKE lower('" + term.replace(/'/g, "''") + "%') THEN 1 " +
            "          ELSE 2 END), kind, length(label) LIMIT 40");
        } catch (e) { hint.textContent = String(e.message || e); return; }

        res.innerHTML = '';
        if (!rows[0]) { hint.textContent = 'no match'; return; }
        hint.textContent = rows[0].values.length + ' match(es)';
        var seen = {};
        rows[0].values.forEach(function (r) {
          var key = r[0] + '|' + r[1] + '|' + r[3];
          if (seen[key]) return;                 // a gene appears once per drug; show each once
          seen[key] = 1;
          var li = document.createElement('li'), a = document.createElement('a');
          a.href = '#/' + r[3];
          a.innerHTML = '<span class="k">' + r[0] + '</span>' +
                        String(r[1]).replace(/[<>&]/g, '') +
                        (r[2] ? ' <span class="d">' + String(r[2]).replace(/[<>&]/g, '') + '</span>' : '');
          a.addEventListener('click', function () { res.innerHTML = ''; box.value = ''; });
          li.appendChild(a); res.appendChild(li);
        });
      }

      hook.doneEach(function () {
        var nav = document.querySelector('.sidebar');
        if (!nav || nav.querySelector('.pks')) return;   // built once, survives navigation
        var wrap = document.createElement('div');
        wrap.className = 'pks';
        wrap.innerHTML = '<input type="search" placeholder="Search drugs, papers, genes…" ' +
                         'aria-label="Search the knowledge base" autocomplete="off">' +
                         '<div class="pks-hint"></div><ul class="pks-res"></ul>';
        nav.insertBefore(wrap, nav.firstChild);
        box = wrap.querySelector('input');
        hint = wrap.querySelector('.pks-hint');
        res = wrap.querySelector('.pks-res');
        box.addEventListener('input', function () {
          clearTimeout(timer);
          timer = setTimeout(function () { go(box.value); }, 160);
        });
      });
    });

    // ── query page ─────────────────────────────────────────────────────────────
    // sql.js (688 kB incl. wasm) and the 3.9 MB database load ONLY on /query, and only
    // once per session — the same discipline as the dbs bundle. Every other page is
    // unaffected, which is the whole reason the page is separate.
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      var DB = null, SQL = null, loading = false;

      var CANNED = {
        param: "-- a reported parameter for one drug, with the paper it came from.\n" +
          "-- The drug and parameter boxes above rewrite this query.\n" +
          "SELECT d.generic_name AS drug, p.value, p.unit_verbatim AS unit,\n" +
          "       p.value_si, p.unit_si, r.stem AS paper, p.link_method, r.model_id\n" +
          "FROM parameter p JOIN record r ON r.id = p.record_id\n" +
          "JOIN drug d ON d.slug = r.drug_slug\n" +
          "WHERE p.parameter_id = 'Q49' /*FILTER*/\n" +
          "ORDER BY d.generic_name LIMIT 100;",
        pdpk: "-- drugs with at least one PD model whose driver is a PK model\n" +
          "SELECT d.generic_name AS drug, count(*) AS pd_models,\n" +
          "       group_concat(DISTINCT pd.driver_kind) AS driver\n" +
          "FROM pd_record pd JOIN record r ON r.id = pd.record_id\n" +
          "JOIN drug d ON d.slug = r.drug_slug\n" +
          "WHERE pd.driver_kind IN ('pk_record','cited_pk')\n" +
          "GROUP BY d.generic_name ORDER BY pd_models DESC LIMIT 100;",
        dose: "-- dose-response PD models: the driver is dose, not a concentration\n" +
          "SELECT d.generic_name AS drug, r.stem AS paper, pd.model_family, pd.effect_form\n" +
          "FROM pd_record pd JOIN record r ON r.id = pd.record_id\n" +
          "JOIN drug d ON d.slug = r.drug_slug\n" +
          "WHERE pd.driver_kind = 'dose_only' ORDER BY d.generic_name LIMIT 100;",
        pgx: "-- PGx records acting as a covariate on a PK or PD parameter\n" +
          "SELECT d.generic_name AS drug, x.gene, x.applies_to, x.target_parameter_id AS qcode,\n" +
          "       q.name AS parameter, x.mechanism\n" +
          "FROM pgx_record x JOIN record r ON r.id = x.record_id\n" +
          "JOIN drug d ON d.slug = r.drug_slug\n" +
          "LEFT JOIN qcode q ON q.parameter_id = x.target_parameter_id\n" +
          "WHERE x.applies_to IN ('pk','pd') AND x.target_parameter_id <> 'Q100'\n" +
          "ORDER BY d.generic_name LIMIT 200;",
        gapfill: "-- values a review supplied because the paper itself lacked them.\n" +
          "-- Useful as a curation queue: these are NOT what the paper reported.\n" +
          "SELECT d.generic_name AS drug, r.stem AS paper, p.name, p.value,\n" +
          "       p.unit_verbatim AS unit, p.origin_stem AS borrowed_from\n" +
          "FROM parameter p JOIN record r ON r.id = p.record_id\n" +
          "JOIN drug d ON d.slug = r.drug_slug\n" +
          "WHERE p.link_method = 'review_gapfill' ORDER BY d.generic_name LIMIT 200;",
        disagree: "-- drugs whose papers disagree by more than 2x on apparent clearance.\n" +
          "-- value_si is SI BASE units (unit_si says which: m3/s here), not unit_canonical,\n" +
          "-- so values reported in different units are directly comparable.\n" +
          "SELECT d.generic_name AS drug, count(*) AS n,\n" +
          "       round(min(p.value_si),10) AS lo, round(max(p.value_si),10) AS hi,\n" +
          "       round(max(p.value_si)/min(p.value_si),1) AS spread\n" +
          "FROM parameter p JOIN record r ON r.id = p.record_id\n" +
          "JOIN drug d ON d.slug = r.drug_slug\n" +
          "WHERE p.parameter_id = 'Q27' AND p.value_si > 0\n" +
          "GROUP BY d.generic_name HAVING n > 2 AND spread > 2\n" +
          "ORDER BY spread DESC LIMIT 100;"
      };

      // getElementById returns the FIRST match in the document, which is the wrong node the
      // moment docsify re-renders .markdown-section and leaves an earlier copy of the query
      // controls ahead of the live one: buildParam() then read an empty drug box that nobody
      // could see, and the drug filter vanished with no error anywhere. Resolve the node that
      // is actually inside the rendered section, newest last.
      function el(id) {
        var live = document.querySelectorAll('.markdown-section [id="' + id + '"]');
        if (live.length) return live[live.length - 1];
        var all = document.querySelectorAll('[id="' + id + '"]');
        return all.length ? all[all.length - 1] : null;
      }
      function status(msg, isErr) {
        var s = el('pkq-status'); if (!s) return;
        s.textContent = msg; s.className = 'pkq-status' + (isErr ? ' err' : ''); s.hidden = false;
      }

      function render(res) {
        var out = el('pkq-out'); out.innerHTML = '';
        if (!res || !res.length) { out.innerHTML = '<p class="pkq-meta">No rows. ' +
          'That is an answer too: this drug/parameter combination is not in the extraction.</p>'; return; }
        var r = res[0], t = document.createElement('table');
        var thead = document.createElement('thead'), tr = document.createElement('tr');
        r.columns.forEach(function (c) {
          var th = document.createElement('th'); th.textContent = c; tr.appendChild(th);
        });
        thead.appendChild(tr); t.appendChild(thead);
        var tb = document.createElement('tbody');
        r.values.forEach(function (row) {
          var trr = document.createElement('tr');
          row.forEach(function (v, i) {
            var td = document.createElement('td');
            if (typeof v === 'number') td.className = 'num';
            // model_id links to the record page, so a number reaches its provenance.
            if (r.columns[i] === 'model_id' && v) {
              var drugCol = r.columns.indexOf('drug');
              var a = document.createElement('a');
              a.textContent = v;
              a.href = '#/drugs/drug_' + String(row[drugCol] || '').toLowerCase()
                        .replace(/[^a-z0-9]+/g, '_') + '/' + v;
              td.appendChild(a);
            } else { td.textContent = v === null ? '' : String(v); }
            trr.appendChild(td);
          });
          tb.appendChild(trr);
        });
        t.appendChild(tb); out.appendChild(t);
        el('pkq-meta').textContent = r.values.length + ' row(s)';
      }

      function run() {
        if (!DB) return;
        var box = el('pkq-sql');
        if (!box) return;
        var sql = box.value;
        try {
          var t0 = performance.now();
          render(DB.exec(sql));
          // Show the WHERE actually executed. The filter bug that shipped an hour ago ran a
          // query with no drug filter and looked exactly like a correct empty-filter result.
          var body = sql.replace(/^\s*--.*$/gm, '');          // drop comment lines first
          var where = (body.match(/\bWHERE\b[\s\S]*?(?=\bORDER BY\b|\bGROUP BY\b|\bLIMIT\b|$)/i)
                       || [''])[0].replace(/\s+/g, ' ').trim();
          el('pkq-meta').textContent += '  ·  ' + Math.round(performance.now() - t0) + ' ms'
                                      + (where ? '  ·  ' + where : '');
        } catch (e) {
          el('pkq-out').innerHTML = '';
          el('pkq-meta').textContent = '';
          status(String(e.message || e), true);
        }
      }

      function sq(v) { return String(v).replace(/'/g, "''"); }

      function qcodeFor(text) {
        // Resolve a typed parameter name through the ontology's 740 synonyms, so
        // "absorption rate constant" finds Q49 without the reader knowing Q-codes exist.
        if (!text || !DB) return null;
        try {
          var hit = DB.exec(
            "SELECT parameter_id FROM qcode WHERE lower(name) = lower('" + sq(text) + "') " +
            "OR lower(synonyms) LIKE lower('%\"" + sq(text) + "\"%') LIMIT 1");
          if (hit[0]) return hit[0].values[0][0];
          var alt = DB.exec("SELECT detail FROM search_doc WHERE kind='parameter' AND " +
                            "lower(label) = lower('" + sq(text) + "') LIMIT 1");
          if (alt[0]) return String(alt[0].values[0][0]).split(' ')[0];
        } catch (e) { /* fall through: an unresolvable name just leaves the code alone */ }
        return null;
      }

      function buildParam() {
        // Built from the template, never by patching the finished string. The previous
        // version appended "AND drug = 'x'" after ORDER BY, which SQLite happily parses as a
        // boolean sort key — no error, and the filter silently did nothing.
        var drug = ((el('pkq-drug') || {}).value || '').trim();
        var code = ((el('pkq-code') || {}).value || '').trim();
        var sql = CANNED.param;
        var filters = '';
        if (drug) filters += " AND lower(d.generic_name) = lower('" + sq(drug) + "')";
        var q = qcodeFor(code);
        if (q) {
          sql = sql.replace("p.parameter_id = 'Q49'", "p.parameter_id = '" + sq(q) + "'");
        } else if (code) {
          // Unresolvable name: match the parameter's own label instead. It REPLACES the
          // Q-code predicate — ANDing them pinned Q49 and could never match anything else.
          sql = sql.replace("p.parameter_id = 'Q49'",
                            "lower(p.name) LIKE lower('%" + sq(code) + "%')");
        }
        // split/join, not replace(): replace() with a STRING pattern substitutes only the
        // FIRST match. The template's own help line used to mention /*FILTER*/, so the drug
        // clause was spliced into a SQL COMMENT while the real marker in the WHERE stayed
        // put — and SQLite reads a stray /*FILTER*/ as a block comment, so the query ran
        // clean and unfiltered. Nothing to see in the console, wrong rows on the page.
        return sql.split('/*FILTER*/').join(filters);
      }

      function fillLists() {
        try {
          var ds = DB.exec("SELECT generic_name FROM drug ORDER BY generic_name");
          if (ds[0]) ds[0].values.forEach(function (v) {
            var o = document.createElement('option'); o.value = v[0];
            el('pkq-drugs').appendChild(o);
          });
          var qs = DB.exec("SELECT parameter_id, name FROM qcode ORDER BY name");
          if (qs[0]) qs[0].values.forEach(function (v) {
            var o = document.createElement('option'); o.value = v[1]; o.label = v[0];
            el('pkq-codes').appendChild(o);
          });
        } catch (e) { /* lists are a convenience; a failure here must not block queries */ }
      }

      function boot() {
        if (DB) { el('pkq-status').hidden = true; el('pkq-ui').hidden = false; return; }
        if (loading) return;
        loading = true;
        window.pkdb.load(status).then(function (db) {
          DB = db;
          fillLists();
          el('pkq-status').hidden = true;
          el('pkq-ui').hidden = false;
          el('pkq-sql').dataset.kind = 'param';
          el('pkq-sql').value = buildParam();
          run();
        }).catch(function (e) { loading = false; status(String(e.message || e), true); });
      }

      hook.doneEach(function () {
        if (!document.getElementById('pkq')) return;     // every other page stops here
        boot();
        var ui = el('pkq-ui');
        // Every control is looked up before any is wired. marked ends an HTML block at the
        // first blank line, so a stray blank line in query.md silently drops the inner
        // controls; wiring them unchecked threw inside the hook and took the page down.
        var runBtn = el('pkq-run'), sqlBox = el('pkq-sql');
        if (ui && runBtn && sqlBox && !ui.dataset.wired) {
          ui.dataset.wired = '1';
          void 0;
          // DELEGATED, and every node resolved at call time. Docsify replaces
          // .markdown-section wholesale on each render, so a handler bound to a captured
          // element keeps writing into a node that is no longer on the page — the SQL box you
          // see stays stale while an invisible twin gets updated. Listening on document and
          // calling el() inside the handler survives any number of re-renders.
          document.addEventListener('click', function (ev) {
            var b = ev.target.closest && ev.target.closest('.pkq-btn[data-q]');
            if (!b || !el('pkq-sql')) return;
            var kind = b.dataset.q;
            el('pkq-sql').dataset.kind = kind;
            el('pkq-sql').value = (kind === 'param') ? buildParam() : CANNED[kind];
            run();
          });
          document.addEventListener('input', function (ev) {
            var t = ev.target;
            if (!t || (t.id !== 'pkq-drug' && t.id !== 'pkq-code')) return;
            var box = el('pkq-sql');
            if (!box || box.dataset.kind !== 'param') return;   // never clobber hand-written SQL
            box.value = buildParam();
          });
          document.addEventListener('keydown', function (ev) {
            var t = ev.target;
            if (!t) return;
            if ((t.id === 'pkq-drug' || t.id === 'pkq-code') && ev.key === 'Enter') { run(); return; }
            if (t.id === 'pkq-sql' && (ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') run();
          });
          document.addEventListener('click', function (ev) {
            if (ev.target && ev.target.id === 'pkq-run') run();
          });
        } else if (ui && !runBtn) {
          status('The query controls did not render — see query.md.', true);
        }
      });
    });

    // ── breadcrumbs ────────────────────────────────────────────────────────────
    // Renders the trail the BUILDER stamped into .pk-crumbs. Nothing here derives a label
    // from the route: the builder knows the drug's generic name and its ATC class, a URL
    // only knows drug_abacavir.
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      hook.doneEach(function () {
        var section = document.querySelector('.markdown-section');
        if (!section) return;
        var old = section.querySelector('nav.pk-crumbtrail');
        if (old) old.remove();                       // re-render on every route change
        var mark = section.querySelector('.pk-crumbs');
        if (!mark) return;
        var items;
        try { items = JSON.parse(mark.dataset.crumbs || '[]'); } catch (e) { return; }
        if (!items.length) return;

        var nav = document.createElement('nav');
        nav.className = 'pk-crumbtrail';
        nav.setAttribute('aria-label', 'breadcrumb');
        items.forEach(function (item, i) {
          if (i) {
            var sep = document.createElement('span');
            sep.className = 'sep';
            sep.textContent = '\u203A';
            nav.appendChild(sep);
          }
          var node;
          if (item.href && i < items.length - 1) {
            node = document.createElement('a');
            // Docsify routes are hash paths and the stamped href is site-relative.
            node.href = '#/' + String(item.href).replace(/^\/+/, '').replace(/README\.md$/, '');
          } else {
            node = document.createElement('span');
            node.className = 'here';               // last crumb is the page itself
          }
          node.textContent = item.label;
          nav.appendChild(node);
        });
        section.insertBefore(nav, section.firstChild);   // above the <h1>
      });
    });

    // Floating record panel: renders the list the BUILDER stamped into .pk-recnav (same
    // reasoning as the crumbs — the builder knows every record's page and status, the
    // route knows only this one). Collapsed state is remembered per browser.
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      var KEY = 'pk-recpanel-closed';
      function closed() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
      hook.doneEach(function () {
        var old = document.querySelector('aside.pk-recpanel');
        if (old) old.remove();
        var section = document.querySelector('.markdown-section');
        var mark = section && section.querySelector('.pk-recnav');
        if (!mark) return;
        var items;
        try { items = JSON.parse(mark.dataset.items || '[]'); } catch (e) { return; }
        if (!items.length) return;

        var box = document.createElement('aside');
        box.className = 'pk-recpanel' + (closed() ? ' closed' : '');
        box.setAttribute('aria-label', 'popPK records of this drug');
        var hd = document.createElement('button');
        hd.className = 'hd';
        hd.type = 'button';
        hd.innerHTML = 'popPK records <span class="n">(' + items.length + ')</span><span class="tg"></span>';
        function paint() { hd.querySelector('.tg').textContent = box.classList.contains('closed') ? '\u25BE' : '\u25B4'; }
        hd.addEventListener('click', function () {
          box.classList.toggle('closed');
          try { localStorage.setItem(KEY, box.classList.contains('closed') ? '1' : '0'); } catch (e) {}
          paint();
        });
        paint();
        box.appendChild(hd);

        var ul = document.createElement('ul');
        items.forEach(function (it) {
          var li = document.createElement('li');
          if (it.here) li.className = 'here';
          var a = document.createElement('a');
          a.href = '#/' + String(it.href || '').replace(/^\/+/, '').replace(/\.md$/, '');
          a.textContent = it.label;
          a.title = it.label + ' \u2014 ' + it.status;
          var b = document.createElement('span');
          b.className = 'pk-badge ' + (it.css || 'pk-badge--neutral');
          b.textContent = it.status;
          li.appendChild(a);
          li.appendChild(b);
          ul.appendChild(li);
        });
        box.appendChild(ul);
        document.body.appendChild(box);
      });
    });

  </script>
  <!-- Docsify v4 -->
  <script>
    // ── shared database ────────────────────────────────────────────────────────
    // One 5 MB SQLite file serves both the query page and the sidebar search. It is fetched
    // once per session and kept in the CACHE API between sessions: localStorage caps at about
    // 5 MB (which is what broke docsify's own search index), while the Cache API holds a blob
    // this size without complaint. The filename carries a content hash, so a new release is a
    // new URL and the old entry is simply dropped.
    window.pkdb = (function () {
      var promise = null, DB = null;
      var CACHE = 'pharmacolibrary-db-v1';

      function bytes(url) {
        if (!window.caches) return fetch(url).then(function (r) { return r.arrayBuffer(); });
        return caches.open(CACHE).then(function (c) {
          return c.match(url).then(function (hit) {
            if (hit) return hit.arrayBuffer();
            return fetch(url).then(function (r) {
              if (!r.ok) throw new Error('database not found: ' + url);
              c.put(url, r.clone()).catch(function () {});   // caching is best-effort
              return r.arrayBuffer();
            });
          });
        });
      }

      function load(onStatus) {
        if (promise) return promise;
        onStatus = onStatus || function () {};
        promise = new Promise(function (resolve, reject) {
          onStatus('Loading the query engine…');
          var tag = document.createElement('script');
          tag.src = 'assets/sqljs/sql-wasm.js';
          tag.onerror = function () { promise = null; reject(new Error('could not load sql.js')); };
          tag.onload = function () {
            initSqlJs({ locateFile: function (f) { return 'assets/sqljs/' + f; } })
              .then(function (SQL) {
                onStatus('Fetching the database…');
                return fetch('data/latest.json').then(function (r) { return r.json(); })
                  .then(function (meta) { return bytes('data/' + meta.file); })
                  .then(function (buf) {
                    DB = new SQL.Database(new Uint8Array(buf));
                    resolve(DB);
                  });
              })
              .catch(function (e) { promise = null; reject(e); });
          };
          document.body.appendChild(tag);
        });
        return promise;
      }
      return { load: load, get: function () { return DB; } };
    })();
  </script>

  <script src="assets/docsify.js"></script>
  <!-- The official docsify search plugin is NOT loaded. It caches its index in localStorage
       (~5 MB) and paths:'auto' crawls 8283 pages holding 62 MB of text, so it threw
       QuotaExceededError and stored nothing. The sidebar box below searches the database
       instead — 5420 entities, kept in the Cache API, which has no such limit. -->
  <!-- dbs-bundle.js is 8.6 MB of WebAssembly and was loaded on EVERY page, including the
       index and the 163 ATC pages, which contain no <dbs-pgx> element at all. Only 1953 of
       8118 generated pages use it. It is now fetched the first time a page that actually
       needs it is rendered; docsify is a single-page app, so that happens at most once per
       session and navigating on keeps it in memory. -->
  <script>
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      hook.doneEach(function () {
        if (window.__dbsBundle) return;                         // already loading or loaded
        if (!document.querySelector('dbs-pgx')) return;          // 76% of pages stop here
        window.__dbsBundle = true;
        var s = document.createElement('script');
        s.src = 'assets/js/dbs-bundle.js';
        s.async = true;
        s.onerror = function () { window.__dbsBundle = false; }; // let a later page retry
        document.body.appendChild(s);
      });
    });
  </script>
  <!-- The Simulation tab's <dbs-fmusim> (in-browser WebAssembly FMU run). Same lazy pattern
       as above — only a record page has one — but TWO scripts, and the ORDER is load-bearing.
       dbs-fmusim.js is a per-component webpack build whose shared Aurelia/lodash code was
       split into dbs-shared.js; its entry module sits behind a chunk-loading callback that
       fires only once dbs-shared.js has registered itself. Request dbs-fmusim.js first, or
       alone, and the element simply never upgrades — no error, no console message. So the
       second script is appended from the first one's onload, never in parallel. -->
  <script>
    (window.$docsify.plugins = window.$docsify.plugins || []).push(function (hook) {
      hook.doneEach(function () {
        if (window.__dbsFmusim) return;
        if (!document.querySelector('dbs-fmusim')) return;
        window.__dbsFmusim = true;
        var shared = document.createElement('script');
        shared.src = 'assets/js/dbs-shared.js';
        shared.async = true;
        shared.onerror = function () { window.__dbsFmusim = false; };
        shared.onload = function () {
          var comp = document.createElement('script');
          comp.src = 'assets/js/dbs-fmusim.js';
          comp.async = true;
          comp.onerror = function () { window.__dbsFmusim = false; };
          document.body.appendChild(comp);
        };
        document.body.appendChild(shared);
      });
    });
  </script>
</body>
