<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharmacolibrary</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Population pharmacokinetic, pharmacodynamic and pharmacogenomic models extracted from the literature, with runnable simulators, for drugs and toxins.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="assets/w3.css">
  <link rel="stylesheet" href="assets/buble.css">
  <link rel="stylesheet" href="assets/sidebar-collapse.min.css">
  <link rel="stylesheet" href="assets/css/ledger.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/records.css">
  <link rel="stylesheet" href="assets/css/query.css">
  <link rel="stylesheet" href="assets/css/sites.css">
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/docsify-config.js" defer></script>
  <script src="assets/js/pk-legacy-routes.js" defer></script>
  <script src="assets/js/pk-disclaimer.js" defer></script>
  <script src="assets/js/pk-page-title.js" defer></script>
  <script src="assets/js/pk-cover.js" defer></script>
  <script src="assets/js/pk-tablist.js" defer></script>
  <script src="assets/js/pk-record-tabs.js" defer></script>
  <!-- The official docsify search plugin is NOT loaded. It caches its index in localStorage
       (~5 MB) and paths:'auto' crawls 8283 pages holding 62 MB of text, so it threw
       QuotaExceededError and stored nothing. The sidebar box and the cover's search
       (pk-sidebar-search.js) search the database's drugs instead — by name, synonym or brand,
       kept in the Cache API, which has no such limit. -->
  <script src="assets/js/pk-sidebar-search.js" defer></script>
  <script src="assets/js/pk-query-page.js" defer></script>
  <script src="assets/js/pk-sites-page.js" defer></script>
  <script src="assets/js/pk-breadcrumbs.js" defer></script>
  <script src="assets/js/pk-record-panel.js" defer></script>
  <script src="assets/js/pk-db.js" defer></script>
  <!-- Docsify v4 -->
  <script src="assets/docsify.js" defer></script>
  <script src="assets/docsify-sidebar-collapse.min.js" defer></script>
  <script src="assets/js/pk-sidebar-state.js" defer></script>
  <!-- The dbs-* web components come from the pinned release (components.lock.json →
       assets/vendor/dbs-components/<sha>/) and load on the first page that uses them:
       dbs-bundle.js is 8.6 MB of WebAssembly and was once fetched on EVERY page, including
       the index and the 163 ATC pages, which contain no <dbs-pgx> element at all. docsify
       is a single-page app, so at most once per session. The Simulation tab's <dbs-fmusim>
       is two scripts whose ORDER is load-bearing; pk-components-loader.js sequences them.
       dbs-pgx has no pinned entry point: existing tags are hidden (pk-components-loader). -->
  <script src="assets/js/pk-demo.js" defer></script>
  <script src="assets/js/pk-components-loader.js" defer></script>
</body>
</html>
